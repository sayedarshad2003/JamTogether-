version: 1
frontend:
  phases:
    preBuild:
      commands:
        - echo "VITE_GOOGLE_CLIENT_ID=53242643213-b9flt3vpm3gl40rt27n4netvjb0pko1k.apps.googleusercontent.com" > .env
        - npm ci --legacy-peer-deps || npm install --legacy-peer-deps
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
