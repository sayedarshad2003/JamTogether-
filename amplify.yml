version: 1
frontend:
  phases:
    preBuild:
      commands:
        - env | grep -E '^VITE_' > .env || true
        - npm ci --legacy-peer-deps || npm install --legacy-peer-deps
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
